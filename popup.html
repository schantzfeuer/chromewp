<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Ayumin</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <h1>Ayumin Gallery</h1>
        <p class="subtitle">Pengaturan Tab Baru</p>
    </header>

    <section class="group">
        <h2>Panel</h2>
        <label class="row" for="bookmarks-toggle">
            <span>Tampilkan Bookmarks</span>
            <input type="checkbox" id="bookmarks-toggle">
        </label>
        <label class="row" for="history-toggle">
            <span>Tampilkan History</span>
            <input type="checkbox" id="history-toggle">
        </label>
    </section>

    <section class="group">
        <h2>Kolase &amp; Gerakan</h2>
        <label class="row" for="motion-toggle">
            <span>Animasi latar (Ken Burns)</span>
            <input type="checkbox" id="motion-toggle">
        </label>
        <label class="row-stack" for="effect-mode">
            <span>Efek foto</span>
            <select id="effect-mode">
                <option value="random">Randomized</option>
                <option value="flat">Plain</option>
                <option value="floating">Floating</option>
                <option value="polaroid">Polaroid</option>
                <option value="framed">Framed</option>
                <option value="stacked">Stacked</option>
                <option value="glow">Neon</option>
                <option value="film">Warm</option>
                <option value="monochrome">Monochrome</option>
                <option value="dreamy">Dreamy</option>
            </select>
            <small class="hint">Pilih satu efek untuk menonaktifkan pengacakan efek.</small>
        </label>
        <label class="row-stack" for="shuffle-interval">
            <span>Ganti tatanan kolase setiap</span>
            <select id="shuffle-interval">
                <option value="2">2 menit</option>
                <option value="5">5 menit</option>
                <option value="10">10 menit</option>
                <option value="15">15 menit</option>
                <option value="30">30 menit</option>
            </select>
        </label>
    </section>

    <section class="group">
        <h2>Sapaan</h2>
        <label class="row-stack" for="username-input">
            <span>Nama panggilan (opsional)</span>
            <input type="text" id="username-input" placeholder="mis. Suaminya Ayumin" maxlength="24">
        </label>
    </section>

    <p class="save-indicator" id="save-indicator" aria-live="polite"></p>

    <script src="popup.js"></script>
</body>
</html>
