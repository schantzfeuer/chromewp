<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab Baru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gallery-container">
        <div id="gallery-track"></div>
    </div>
    
    <div class="vignette-overlay"></div>

    <main class="dashboard">
        <div class="clock-container">
            <h1 id="time">00:00</h1>
            <p id="date">Memuat tanggal...</p>
        </div>

        <div class="menu-container" id="menu-container">
            <section class="menu-box" id="bookmarks-box">
                <h2><span class="icon">⭐</span> Bookmarks</h2>
                <ul id="bookmarks-list"></ul>
            </section>
            
            <section class="menu-box" id="history-box">
                <h2><span class="icon">🕒</span> History</h2>
                <ul id="history-list"></ul>
            </section>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>s
